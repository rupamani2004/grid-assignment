<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Grid Layout Assignment</title>
  <style>
    .container {
      width: 600px;
      margin: 40px auto;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 10px;
    }
    .item {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2em;
      color: white;
      height: 120px;
      font-weight: bold;
      border-radius: 8px;
    }
    .item1 { background: #13bdf0; }
    .item2 { background: #ff4f22; }
    .item3 { background: #4563fa; }
    .item4 { background: #ffd633; color: #333;}
    .item5 { background: #a341db; }
    .item6 { background: #55dd53; color: #222;}
    .item7 { background: #ff875c; }
    .item8 { background: #15bdbf; }
    .item9 { background: #800000; }
  </style>
</head>
<body>
  <div class="container">
    <div class="item item2">2.</div>
    <div class="item item3">3.</div>
    <div class="item item4">4.</div>
    <div class="item item5">5.</div>
    <div class="item item6">6.</div>
    <div class="item item1">1.</div>
    <div class="item item7">7.</div>
    <div class="item item8">8.</div>
    <div class="item item9">9.</div>
  </div>
</body>
</html>
